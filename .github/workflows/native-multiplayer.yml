name: Native multiplayer component checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dawn/src/core/multiplayer/**'
      - 'Dawn/src/client/hooks/bootflow/native_identity_observation.*'
      - 'Dawn/src/client/hooks/bootflow/towerfall_executor_bootstrap.cpp'
      - 'Dawn/Dawn.vcxproj'
      - 'Dawn/src/middleware/bap/address_resolution.*'
      - 'Dawn/src/middleware/bap/bap_frame.cpp'
      - 'Dawn/src/middleware/bap/frame.h'
      - 'Dawn/src/middleware/crypto/**'
      - 'Dawn/src/middleware/gameplay/**'
      - 'Dawn/src/server/bap/**'
      - 'Dawn/src/server/gameplay/**'
      - 'Dawn/src/steam/**'
      - 'Dawn/unit/*companion*'
      - 'Dawn/unit/*address_resolution*'
      - 'Dawn/unit/*des_cbc*'
      - 'Dawn/unit/*routed_datagram*'
      - 'Dawn/unit/*resolution_replay*'
      - 'Dawn/unit/*endpoint_resolution*'
      - 'Dawn/unit/*peer_view_echo*'
      - 'Dawn/unit/*shared_membership*'
      - 'Dawn/unit/*steam_social*'
      - 'Dawn/unit/*native_identity_observation*'
      - 'tools/testing/*multiplayer_runtime_snapshot.py'
      - 'tools/launcher/**'
      - '.github/workflows/native-multiplayer.yml'
  pull_request:
    paths:
      - 'Dawn/src/core/multiplayer/**'
      - 'Dawn/src/client/hooks/bootflow/native_identity_observation.*'
      - 'Dawn/src/client/hooks/bootflow/towerfall_executor_bootstrap.cpp'
      - 'Dawn/Dawn.vcxproj'
      - 'Dawn/src/middleware/bap/address_resolution.*'
      - 'Dawn/src/middleware/bap/bap_frame.cpp'
      - 'Dawn/src/middleware/bap/frame.h'
      - 'Dawn/src/middleware/crypto/**'
      - 'Dawn/src/middleware/gameplay/**'
      - 'Dawn/src/server/bap/**'
      - 'Dawn/src/server/gameplay/**'
      - 'Dawn/src/steam/**'
      - 'Dawn/unit/*companion*'
      - 'Dawn/unit/*address_resolution*'
      - 'Dawn/unit/*des_cbc*'
      - 'Dawn/unit/*routed_datagram*'
      - 'Dawn/unit/*resolution_replay*'
      - 'Dawn/unit/*endpoint_resolution*'
      - 'Dawn/unit/*peer_view_echo*'
      - 'Dawn/unit/*shared_membership*'
      - 'Dawn/unit/*steam_social*'
      - 'Dawn/unit/*native_identity_observation*'
      - 'tools/testing/*multiplayer_runtime_snapshot.py'
      - 'tools/launcher/**'
      - '.github/workflows/native-multiplayer.yml'

permissions:
  contents: read

jobs:
  component-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build and run native component tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($suite in @('companion_protocol', 'companion_client', 'steam_social', 'shared_membership', 'address_resolution', 'des_cbc', 'routed_datagram', 'resolution_replay', 'address_resolution_host', 'endpoint_resolution', 'peer_view_echo', 'native_identity_observation')) {
            $destination = Join-Path $PWD "build/native-ci/$suite/"
            & msbuild "Dawn/unit/$($suite)_tests.vcxproj" /nologo /v:minimal /m:2 /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 "/p:OutDir=$destination" "/p:IntDir=$($destination)obj/"
            if ($LASTEXITCODE -ne 0) { throw "$suite compilation failed" }
            & (Join-Path $destination "$($suite)_tests.exe")
            if ($LASTEXITCODE -ne 0) { throw "$suite tests failed" }
            if ($suite -eq 'address_resolution_host') {
              & (Join-Path $destination "$($suite)_tests.exe") --disabled
              if ($LASTEXITCODE -ne 0) { throw 'Disabled address-resolution mode failed' }
            }
            if ($suite -eq 'native_identity_observation') {
              & (Join-Path $destination "$($suite)_tests.exe") --layout-refused
              if ($LASTEXITCODE -ne 0) { throw 'Unsupported identity-observation layout was accepted' }
            }
          }
      - name: Test read-only runtime snapshots
        shell: powershell
        run: python -m unittest discover -s tools/testing -p test_multiplayer_runtime_snapshot.py -v
      - name: Build production companion test workers
        shell: powershell
        run: |
          $destination = Join-Path $PWD 'build/native-ci/companion_bridge/'
          & msbuild Dawn/unit/companion_bridge_harness.vcxproj /nologo /v:minimal /m:2 /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 "/p:OutDir=$destination" "/p:IntDir=$($destination)obj/"
          if ($LASTEXITCODE -ne 0) { throw 'Native companion workers failed to build' }
      - name: Test C++ and launcher interoperability
        shell: powershell
        run: |
          ./tools/launcher/Build-Launcher.ps1 -RunTests
          $harness = Join-Path $PWD 'build/native-ci/companion_bridge/companion_bridge_harness.exe'
          $report = Join-Path $PWD 'build/native-ci/native-companion-results.txt'
          $worker = Start-Process -FilePath ./build/launcher/MultiDawn.Launcher.exe -ArgumentList @('--native-companion-test', ('"' + $harness + '"'), ('"' + $report + '"')) -WindowStyle Hidden -PassThru
          if (-not $worker.WaitForExit(60000)) { $worker.Kill(); throw 'Native interoperability test timed out' }
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($worker.ExitCode -ne 0) { throw 'Native interoperability test failed' }
